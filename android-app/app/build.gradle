plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def releaseVersionCode = providers.gradleProperty("VERSION_CODE")
        .orElse(providers.environmentVariable("ANDROID_VERSION_CODE"))
        .getOrElse("1").toInteger()
def releaseVersionName = providers.gradleProperty("VERSION_NAME")
        .orElse(providers.environmentVariable("ANDROID_VERSION_NAME"))
        .getOrElse("1.0.0")

def releaseStoreFile = providers.gradleProperty("RELEASE_STORE_FILE")
        .orElse(providers.environmentVariable("ANDROID_RELEASE_STORE_FILE")).orNull
def releaseStorePassword = providers.gradleProperty("RELEASE_STORE_PASSWORD")
        .orElse(providers.environmentVariable("ANDROID_RELEASE_STORE_PASSWORD")).orNull
def releaseKeyAlias = providers.gradleProperty("RELEASE_KEY_ALIAS")
        .orElse(providers.environmentVariable("ANDROID_RELEASE_KEY_ALIAS")).orNull
def releaseKeyPassword = providers.gradleProperty("RELEASE_KEY_PASSWORD")
        .orElse(providers.environmentVariable("ANDROID_RELEASE_KEY_PASSWORD")).orNull
def releaseSigningConfigured = [releaseStoreFile, releaseStorePassword, releaseKeyAlias, releaseKeyPassword]
        .every { it != null && !it.isBlank() }

android {
    namespace 'com.tether.app'
    compileSdk 36

    defaultConfig {
        applicationId "com.imagetether.tethercam"
        minSdk 24
        targetSdk 36
        versionCode releaseVersionCode
        versionName releaseVersionName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            if (releaseSigningConfigured) {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (releaseSigningConfigured) signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    bundle {
        language { enableSplit = true }
        density { enableSplit = true }
        abi { enableSplit = true }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        viewBinding true
    }
}

def allowUnsignedRelease = providers.gradleProperty("allowUnsignedRelease")
        .map { it.toBoolean() }.getOrElse(false)
tasks.register("verifyReleaseSigning") {
    doLast {
        if (!releaseSigningConfigured && !allowUnsignedRelease) {
            throw new GradleException("Release signing is not configured. Set ANDROID_RELEASE_STORE_FILE, ANDROID_RELEASE_STORE_PASSWORD, ANDROID_RELEASE_KEY_ALIAS, and ANDROID_RELEASE_KEY_PASSWORD. Use -PallowUnsignedRelease=true only for local verification.")
        }
    }
}

tasks.configureEach { task ->
    if (task.name in ["assembleRelease", "bundleRelease"]) {
        task.dependsOn("verifyReleaseSigning")
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'

    // CameraX dependencies
    def camerax_version = "1.3.1"
    implementation "androidx.camera:camera-core:${camerax_version}"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-view:${camerax_version}"

    // OkHttp (WebSocket client)
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test:rules:1.5.0'
    androidTestImplementation 'androidx.test:core:1.5.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
