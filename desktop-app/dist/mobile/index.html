<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>TETHER</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0b0f19;
      --accent-color: #38bdf8;
      --success-color: #34d399;
      --danger-color: #f87171;
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      height: 100vh;
      height: 100dvh;
      min-height: 100svh;
      padding-bottom: env(safe-area-inset-bottom);
      overflow-x: hidden;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    /* Screen flash effect */
    #flash-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: white;
      opacity: 0;
      pointer-events: none;
      z-index: 100;
      transition: opacity 0.05s ease;
    }
    #flash-overlay.flash {
      opacity: 1;
    }

    /* Video Viewfinder */
    .viewfinder-container {
      position: relative;
      flex: 1 0 14rem;
      min-height: 14rem;
      width: 100%;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      padding: 1rem 1rem calc(1rem + env(safe-area-inset-bottom));
      overflow: hidden;
    }

    #viewfinder {
      width: 100%;
      height: 100%;
      object-fit: cover;
      position: absolute;
      inset: 0;
      z-index: 0;
    }

    /* Fallback Uploader View */
    .fallback-container {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: clamp(0.5rem, 2vh, 1rem);
      text-align: center;
      gap: 0.5rem;
      width: 100%;
      position: relative;
      background-color: var(--bg-color);
      z-index: 1;
    }

    .fallback-title {
      font-size: 1.5rem;
      font-weight: 700;
    }

    .fallback-text {
      font-size: 0.95rem;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .btn-upload {
      background: linear-gradient(135deg, var(--accent-color), #0284c7);
      color: var(--bg-color);
      border: none;
      padding: 1rem 2rem;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(56, 189, 248, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      text-decoration: none;
      width: 100%;
      min-height: 3.25rem;
    }

    .btn-upload.sending {
      background: linear-gradient(135deg, #0ea5e9, #0369a1);
      animation: pulse-button 1.5s infinite;
    }

    .btn-secondary {
      background: #131b2e;
      color: var(--text-color);
      border: 1px solid rgba(255,255,255,0.14);
      padding: 0.8rem 1rem;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      min-height: 3.25rem;
    }

    .btn-secondary:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    /* Connection Overlay Banner */
    .connection-banner {
      position: relative;
      align-self: center;
      margin: 1rem auto 0;
      background: rgba(11, 15, 25, 0.85);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.1);
      padding: 0.5rem 1rem;
      border-radius: 9999px;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.85rem;
      font-weight: 600;
      z-index: 10;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    .connection-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--danger-color);
    }
    .connection-dot.connected {
      background-color: var(--success-color);
      box-shadow: 0 0 8px var(--success-color);
    }

    .capture-actions {
      flex: 0 0 auto;
      position: relative;
      width: 100%;
      max-width: 32rem;
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
      padding: 0;
      z-index: 2;
    }

    @keyframes pulse-button {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(0.95); }
    }

    #file-input {
      display: none;
    }

    .transfer-progress {
      position: absolute;
      bottom: calc(148px + env(safe-area-inset-bottom));
      left: 1rem;
      right: 1rem;
      z-index: 15;
      padding: 0.6rem 0.8rem;
      border-radius: 10px;
      background: rgba(11, 15, 25, 0.9);
      color: var(--text-color);
      font-size: 0.8rem;
    }

    .transfer-progress[hidden] {
      display: none;
    }

    .transfer-progress progress {
      display: block;
      width: 100%;
      height: 0.45rem;
      margin-top: 0.35rem;
      accent-color: var(--accent-color);
    }

    /* Toast Notifications */
    .toast-msg {
      position: absolute;
      bottom: calc(160px + env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      background: rgba(52, 211, 153, 0.95);
      color: #0b0f19;
      padding: 0.6rem 1.2rem;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 700;
      box-shadow: 0 10px 20px rgba(0,0,0,0.4);
      z-index: 50;
      opacity: 0;
      transition: opacity 0.3s ease, transform 0.3s ease;
      transform: translate(-50%, 10px);
      pointer-events: none;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .toast-msg.error {
      background: rgba(248, 113, 113, 0.96);
      color: #0b0f19;
    }
    .toast-msg.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }
  </style>
</head>
<body>

  <!-- Camera Flash Overlay -->
  <div id="flash-overlay"></div>

  <!-- Realtime Connection Status -->
  <div class="connection-banner">
    <div id="status-dot" class="connection-dot"></div>
    <span id="status-text" role="status" aria-live="polite">Connecting to Desktop...</span>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="toast-msg">
    <span>✓</span> Sent Instantly
  </div>

  <!-- Camera Viewport Area -->
  <div class="viewfinder-container">
    <video id="viewfinder" autoplay playsinline muted></video>

    <!-- Fallback if camera stream blocks -->
    <div id="fallback-view" class="fallback-container" aria-live="polite">
      <div id="fallback-title" class="fallback-title">Direct Camera Access</div>
      <div id="fallback-text" class="fallback-text">
        Live camera preview is unavailable. Use Open Camera to take a picture or Choose Photo to select an image.
      </div>
    </div>

    <div class="capture-actions" aria-label="Image capture actions">
      <button class="btn-upload" id="open-camera" type="button">Open Camera</button>
      <button class="btn-secondary" id="choose-photo" type="button">Choose Photo</button>
    </div>
  </div>

  <div id="transfer-progress" class="transfer-progress" role="status" aria-live="polite" hidden>
    <span id="transfer-progress-text">Preparing image...</span>
    <progress id="transfer-progress-bar" max="100" value="0" aria-label="Image transfer progress"></progress>
  </div>

  <!-- Invisible file uploads and captures -->
  <input type="file" id="file-input" accept="image/jpeg,image/png,image/webp">
  <canvas id="capture-canvas" style="display: none;"></canvas>

  <script src="image-validation.js"></script>
  <script src="auth-crypto.js"></script>
  <script src="reconnect-policy.js"></script>
  <script src="mobile.js"></script>
</body>
</html>
